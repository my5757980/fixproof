name: Demo uptime

# Daily check of the public judge demo through the judging period (SC-008). Set the repository
# variable FIXPROOF_DEMO_URL (Settings > Secrets and variables > Actions > Variables).

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health
        id: check
        env:
          DEMO_URL: ${{ vars.FIXPROOF_DEMO_URL }}
        run: |
          set -u
          if [[ "$(date -u +%F)" > "2026-12-15" ]]; then
            echo "The judging period is over; nothing to check."
            exit 0
          fi
          if [ -z "${DEMO_URL:-}" ]; then
            echo "problem=The repository variable FIXPROOF_DEMO_URL is not set." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url="${DEMO_URL%/}/api/health"
          # A sleeping Hugging Face Space can take about a minute to wake up, so retry.
          body=""
          for attempt in 1 2 3 4 5 6; do
            if body=$(curl -fsS --max-time 60 "$url"); then
              break
            fi
            body=""
            sleep 30
          done
          if [ -z "$body" ]; then
            echo "problem=The demo did not answer at $url." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$body"
          live=$(printf '%s' "$body" | jq -r '.live_runs_available')
          reason=$(printf '%s' "$body" | jq -r '.reason // "no reason given"' | tr -d '\r\n' | cut -c1-300)
          if [ "$live" != "true" ]; then
            echo "problem=Live runs are unavailable: $reason" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update an issue
        if: steps.check.outputs.problem != ''
        uses: actions/github-script@v7
        env:
          PROBLEM: ${{ steps.check.outputs.problem }}
        with:
          script: |
            const title = "Demo health check failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${process.env.PROBLEM}\n\nFound by the scheduled uptime check: ${run}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
            core.setFailed(process.env.PROBLEM);
