[project]
name = "fixproof"
version = "0.1.0"
description = "Autonomous coding agent that fixes bugs in real repositories and proves each fix with tests run in Nebius Token Factory Sandboxes, powered by NVIDIA Nemotron."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "FixProof contributors" }]
keywords = ["coding-agent", "nemotron", "nebius", "token-factory", "sandboxes", "pytest"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "contree-sdk>=0.3.6",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
fixproof = "fixproof.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixproof"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# SpecKit tooling and design documents are not product code.
extend-exclude = [".claude", ".specify", "history", "specs"]

[tool.ruff.lint]
# D = pydocstyle (Constitution V: every public module, class, and function has a docstring).
select = ["E", "F", "I", "B", "UP", "SIM", "D"]
# D105/D107: magic methods and __init__ are documented in the class docstring.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/fixproof"]
plugins = ["pydantic.mypy"]

# contree-sdk ships no type information (no py.typed marker); it is wrapped in sandbox/contree.py.
[[tool.mypy.overrides]]
module = ["contree_sdk", "contree_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: requires Nebius credentials (set FIXPROOF_LIVE=1)",
    "docker: requires a local Docker daemon (set FIXPROOF_DOCKER=1)",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]
